name: Build GEX Twice Daily (Full Gamma Suite)

on:
  schedule:
    - cron: '0 1,13 * * *' # Runs at 1 AM and 1 PM UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          pip install pandas numpy matplotlib requests

      - name: Run GEX Builder
        env:
          MARKETDATA_KEY: ${{ secrets.MARKETDATA_KEY }}
        run: python gex_builder.py

      - name: Commit and Push Results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # Pull latest changes to avoid conflicts
          git pull --rebase || echo "Already up to date"
          # Force add all generated files (even if previously ignored)
          git add --force *.csv *.png *.txt
          # Commit
          git commit -m "Auto-update GEX Data [skip ci]" || echo "No changes to commit"
          # Push
          git push
