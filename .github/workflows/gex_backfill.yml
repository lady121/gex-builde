import os
import time
import requests

def fetch_marketdata_chain(ticker, date_str):
    """
    Fetches options chain data from MarketData API for a specific date,
    with built-in debugging and rate-limit handling.
    """
    api_key = os.getenv("MARKETDATA_KEY")
    if not api_key:
        print("   ❌ ERROR: MARKETDATA_KEY is missing from environment variables!")
        return None

    # Replace this URL with the exact MarketData endpoint you are using 
    # (e.g., /v1/options/chain/{ticker} or /v1/stocks/candles/...)
    url = f"https://api.marketdata.app/v1/options/chain/{ticker}?date={date_str}"
    
    headers = {
        "Authorization": f"Bearer {api_key}",
        "Accept": "application/json"
    }

    try:
        # 🛑 Rate Limiting Guard: MarketData has strict limits on historical chains.
        # Pausing for 1 to 1.5 seconds prevents "429 Too Many Requests" errors.
        time.sleep(1.5) 
        
        response = requests.get(url, headers=headers, timeout=15)
        
        # 🐛 THE FIX: Catch non-200 responses and print the EXACT error from MarketData
        if response.status_code not in (200, 203):
            print(f"      ⚠️ API ERROR {response.status_code} on {date_str} for {ticker}!")
            print(f"      Raw Response: {response.text}")
            return None
            
        data = response.json()
        
        # Check if the API returned a structured error inside a successful response
        if data.get("s") == "error":
            # Sometimes it legitimately says "No data" for weekends/holidays, 
            # but if it says "Rate limit exceeded", you will now see it.
            if "No data" not in data.get("errmsg", ""):
                print(f"      ⚠️ MarketData Error Msg: {data.get('errmsg')}")
            else:
                print("      ⚠️ No price data (Market Closed).")
            return None

        return data

    except requests.exceptions.RequestException as e:
        print(f"      ⚠️ Network Request Failed: {e}")
        return None
    except ValueError:
        print(f"      ⚠️ Failed to parse JSON. Raw API text: {response.text}")
        return None
    except Exception as e:
        print(f"      ⚠️ Unknown Python Crash on {date_str}: {str(e)}")
        return None
