name: GEX + DEX Backfill 🧠

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days to backfill (default 30)"
        required: false
        default: "30"

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests matplotlib

      - name: 🧠 Run GEX Backfill Utility (includes DEX)
        env:
          MARKETDATA_KEY: ${{ secrets.MARKETDATA_KEY }}
          DAYS_TO_BACKFILL: ${{ github.event.inputs.days }}
        run: |
          echo "🔄 Running backfill with DEX support..."
          python gex_backfill_utility.py

      - name: 🚀 Commit and Push Updated CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ${{ github.ref_name }}
          git checkout ${{ github.ref_name }}

          git add *.csv || true
          git commit -m "📈 Auto-backfill GEX+DEX data [$(date +'%Y-%m-%d %H:%M:%S')]" || echo "No changes to commit"
          git pull --no-rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
