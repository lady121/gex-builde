name: GEX + DEX Backfill 🧠

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days to backfill (default 30)"
        required: false
        default: "30"

# 1. EXPLICIT PERMISSIONS: Required to allow the bot to push code back to the repo
permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4
        # Token is handled automatically by checkout@v4, but we keep it here if you use a PAT
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests matplotlib

      - name: 🧠 Run GEX Backfill Utility (includes DEX)
        env:
          MARKETDATA_KEY: ${{ secrets.MARKETDATA_KEY }}
          # 2. MODERN SYNTAX: use 'inputs.days' instead of 'github.event.inputs.days'
          DAYS_TO_BACKFILL: ${{ inputs.days }}
        run: |
          echo "🔄 Running backfill for $DAYS_TO_BACKFILL days with DEX support..."
          python gex_backfill_utility.py
          
      - name: 🔍 Debug - Check generated files
        # 3. DEBUGGING: Let's make sure the Python script actually outputted something
        run: |
          echo "Listing CSV files to see what was generated:"
          ls -la *.csv || echo "No CSV files found!"
          git status

      - name: 🚀 Commit and Push Updated CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add *.csv || true
          
          # 4. BETTER COMMIT LOGIC: Only commit if there are actually changes staged
          if git diff --staged --quiet; then
            echo "No changes detected in CSV files. Skipping commit."
          else
            git commit -m "📈 Auto-backfill GEX+DEX data [$(date +'%Y-%m-%d %H:%M:%S')]"
            git push origin HEAD:${{ github.ref_name }}
          fi
