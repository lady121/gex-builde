name: Convert GEX to Pine Script

# Trigger: Runs automatically ONLY after "Build GEX Twice Daily" finishes
on:
  workflow_run:
    workflows: ["Build GEX Twice Daily (Full Gamma Suite)"]
    types:
      - completed
  workflow_dispatch: # Allows manual run

jobs:
  convert:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run Pine Script Converter
        run: |
          # Priority: Check root first (standard), then 'GEX Tools' folder
          if [ -f "gex_to_pinescript_converter.py" ]; then
            python gex_to_pinescript_converter.py
          elif [ -f "GEX Tools/gex_to_pinescript_converter.py" ]; then
            python "GEX Tools/gex_to_pinescript_converter.py"
          else
            echo "❌ Converter script not found in root or GEX Tools!"
            exit 1
          fi

      - name: Commit Pine Scripts
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull
          git add *.pine || echo "No new pine files"
          git commit -m "Auto-generated Pine Scripts (v6)" || echo "No changes to commit"
          git push
