name: GEX to PineScript Converter 🧩

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild PineScript output (ignore cache)"
        required: false
        default: "false"

  push:
    paths:
      - '**.csv'
      - 'gex_to_pinescript_converter.py'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: 🧠 Run GEX to PineScript Converter
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "⚙️ Force rebuild triggered via workflow dispatch."
            python gex_to_pinescript_converter.py --force
          else
            echo "🌲 Smart rebuild mode (using cache)."
            python gex_to_pinescript_converter.py
          fi

      - name: 📝 Rename & Replace Universal PineScript
        run: |
          LATEST_FILE=$(ls -t Universal_GEX_History_*.pine | head -n 1)
          echo "Found latest: $LATEST_FILE"
          mv "$LATEST_FILE" Universal_GEX_History.pine
          echo "✅ Universal_GEX_History.pine updated."

      - name: 🚀 Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Universal_GEX_History.pine
          git commit -m "🔁 Auto-update Universal_GEX_History.pine [$(date +'%Y-%m-%d %H:%M:%S')]"
          git push origin HEAD:${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
