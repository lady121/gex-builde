name: GEX to PineScript Converter 🧩

on:
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild PineScript output (ignore cache)"
        required: false
        default: "false"

  # (Optional) automatic run when pushing new CSV data
  push:
    paths:
      - '**.csv'
      - 'gex_to_pinescript_converter.py'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: 🧠 Run GEX to PineScript Converter
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "⚙️ Force rebuild triggered via workflow dispatch."
            python gex_to_pinescript_converter.py --force
          else
            echo "🌲 Smart rebuild mode (using cache)."
            python gex_to_pinescript_converter.py
          fi

      - name: 📤 Upload PineScript Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Universal_GEX_History_Pine
          path: Universal_GEX_History_*.pine
