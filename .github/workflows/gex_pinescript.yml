name: GEX to PineScript Converter 🧩

on:
  # ✅ Automatic Schedule (Runs 30 mins after the Builder to ensure data is ready)
  schedule:
    - cron: '30 1,13 * * *' # Runs at 1:30 AM and 1:30 PM UTC
  
  # ✅ Manual Trigger (Maintains the True/False force option)
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild PineScript output (ignore cache)"
        required: false
        default: "false"

  # ✅ Automatic Trigger on File Changes
  push:
    paths:
      - '**.csv'
      - 'gex_to_pinescript_converter.py'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: 🧠 Run GEX → PineScript Converter
        run: |
          # Check if triggered by workflow_dispatch with force=true
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "⚙️ Force rebuild triggered via workflow dispatch."
            python gex_to_pinescript_converter.py --force
          else
            echo "🌲 Smart rebuild mode (using cache)."
            # Scheduled runs and Push events default to this
            python gex_to_pinescript_converter.py
          fi

      - name: 🚀 Commit and Push Updated PineScript
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ${{ github.ref_name }}
          git checkout ${{ github.ref_name }}
          git add Universal_GEX_History.pine .gex_cache.json || true
          git diff --cached --quiet || git commit -m "🔁 Auto-update Universal_GEX_History.pine [$(date +'%Y-%m-%d %H:%M:%S')]"
          git pull --no-rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
