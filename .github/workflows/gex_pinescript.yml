name: Convert GEX to Pine Script

# Trigger: Runs automatically ONLY after "Build GEX Twice Daily" finishes
on:
  workflow_run:
    workflows: ["Build GEX Twice Daily (Full Gamma Suite)"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild PineScript (ignore cache)"
        required: false
        default: "false"

jobs:
  convert:
    runs-on: ubuntu-latest
    # Run logic:
    # 1. Manual run (workflow_dispatch) -> Always run
    # 2. Auto run (workflow_run) -> Only if builder succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run Converter
        run: |
          # Priority check for script location
          SCRIPT_PATH="gex_to_pinescript_converter.py"
          if [ -f "GEX Tools/gex_to_pinescript_converter.py" ]; then
            SCRIPT_PATH="GEX Tools/gex_to_pinescript_converter.py"
          elif [ ! -f "$SCRIPT_PATH" ]; then
            echo "❌ Converter script not found!"
            exit 1
          fi

          # Handle Force Flag
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "⚙️ Force rebuild triggered."
            python "$SCRIPT_PATH" --force
          else
            echo "🌲 Standard run."
            python "$SCRIPT_PATH"
          fi

      - name: 🚀 Commit and Push Updated PineScript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add Universal_GEX_History.pine .gex_cache.json
          git commit -m "🔁 Auto-update Universal_GEX_History.pine [$(date +'%Y-%m-%d %H:%M:%S')]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
